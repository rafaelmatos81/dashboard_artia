<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Artia — Exxata</title>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background-color: #09182b;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      background-color: #09182b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 42px;
      flex-shrink: 0;
      border-bottom: 2px solid #d51d07;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.18);
    }

    .header-title {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(213, 29, 7, 0.85);
      border: 1px solid rgba(213, 29, 7, 0.3);
      padding: 2px 8px;
      border-radius: 3px;
    }

    /* ── MAIN CONTENT ───────────────────────────── */
    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
      gap: 6px;
      padding: 6px;
    }

    /* ── BI PANEL ───────────────────────────────── */
    .bi-wrapper {
      flex: 1;
      overflow: hidden;
      border-radius: 6px;
      border-top: 2px solid #d51d07;
      background: #fff;
    }

    .bi-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── SOCIAL COLUMN ──────────────────────────── */
    .social-column {
      width: 350px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .social-panel {
      flex: 1;
      background-color: #0d2240;
      border-radius: 6px;
      border-top: 2px solid #d51d07;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .social-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }

    .social-panel-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .social-panel-icon.linkedin {
      background-color: #0a66c2;
    }

    .social-panel-icon.instagram {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .social-panel-icon svg {
      width: 16px;
      height: 16px;
    }

    .social-panel-title {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 600;
    }

    .social-panel-subtitle {
      color: rgba(255, 255, 255, 0.35);
      font-size: 10px;
      margin-top: 1px;
    }

    .social-panel-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .social-placeholder {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
      text-align: center;
    }

    .social-placeholder-icon {
      opacity: 0.15;
    }

    .social-placeholder-icon svg {
      width: 48px;
      height: 48px;
    }

    .social-placeholder-text {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      line-height: 1.6;
    }

    .social-placeholder-text strong {
      display: block;
      color: rgba(255, 255, 255, 0.7);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .social-link:hover {
      background-color: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .social-link svg {
      width: 12px;
      height: 12px;
    }

    .social-embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── FOOTER / TICKER ─────────────────────────── */
    .footer {
      background-color: #071526;
      height: 34px;
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      border-top: 2px solid #d51d07;
      overflow: hidden;
    }

    .ticker-label {
      background-color: #d51d07;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 14px;
      display: flex;
      align-items: center;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ticker-wrap {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
    }

    /* fade edges */
    .ticker-wrap::before,
    .ticker-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40px;
      z-index: 2;
      pointer-events: none;
    }

    .ticker-wrap::before {
      left: 0;
      background: linear-gradient(to right, #071526, transparent);
    }

    .ticker-wrap::after {
      right: 0;
      background: linear-gradient(to left, #071526, transparent);
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: ticker-scroll linear infinite;
      will-change: transform;
    }

    @keyframes ticker-scroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .ticker-item {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      padding: 0 8px;
    }

    .ticker-item.t-destaque {
      color: #fbbf24;
      font-weight: 700;
    }

    .ticker-item.t-meta {
      color: #34d399;
      font-weight: 700;
    }

    .ticker-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      border-radius: 3px;
      padding: 1px 5px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .ticker-badge.b-destaque {
      background-color: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .ticker-badge.b-meta {
      background-color: rgba(52, 211, 153, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .ticker-sep {
      display: inline-block;
      color: rgba(213, 29, 7, 0.5);
      padding: 0 16px;
      font-size: 9px;
    }

    .ticker-error {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.3);
      padding: 0 20px;
      font-style: italic;
    }
  </style>
</head>

  <script>
    (function () {
      var XLSX_FILE = '03_news_painel_noticias.xlsx';
      var REFRESH_MS = 5 * 60 * 1000; // recarrega a planilha a cada 5 min
      var SPEED_PX_PER_S = 80; // pixels por segundo — ajuste ao gosto

      function tipoClass(tipo) {
        if (!tipo) return '';
        var t = tipo.trim().toLowerCase();
        if (t === 'destaque') return 't-destaque';
        if (t === 'meta do mês' || t === 'meta do mes') return 't-meta';
        return '';
      }

      function tipoBadgeClass(tipo) {
        if (!tipo) return '';
        var t = tipo.trim().toLowerCase();
        if (t === 'destaque') return 'b-destaque';
        if (t === 'meta do mês' || t === 'meta do mes') return 'b-meta';
        return '';
      }

      function buildHTML(items) {
        // duplica para loop contínuo sem salto
        var doubled = items.concat(items);
        return doubled.map(function (item) {
          var cls = tipoClass(item.tipo);
          var bcls = tipoBadgeClass(item.tipo);
          var badge = bcls
            ? '<span class="ticker-badge ' + bcls + '">' + item.tipo + '</span>'
            : '';
          return '<span class="ticker-item' + (cls ? ' ' + cls : '') + '">'
            + badge + item.texto
            + '</span>'
            + '<span class="ticker-sep">◆</span>';
        }).join('');
      }

      function applyTicker(items) {
        var track = document.getElementById('tickerTrack');
        if (!items || !items.length) {
          track.innerHTML = '<span class="ticker-item">Nenhum aviso disponível.</span>';
          return;
        }

        track.style.animation = 'none';
        track.innerHTML = buildHTML(items);

        // força reflow para reiniciar animação
        void track.offsetWidth;

        var totalWidth = track.scrollWidth / 2; // metade = um ciclo
        var duration = totalWidth / SPEED_PX_PER_S;

        track.style.animation = '';
        track.style.animationDuration = duration + 's';
      }

      function loadNoticias() {
        fetch(XLSX_FILE + '?t=' + Date.now())
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.arrayBuffer();
          })
          .then(function (buf) {
            var wb = XLSX.read(buf, { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
            var items = rows.slice(1)
              .filter(function (r) { return r[1] && String(r[1]).trim(); })
              .map(function (r) {
                return { texto: String(r[1]).trim(), tipo: r[2] ? String(r[2]).trim() : 'Info' };
              });
            applyTicker(items);
          })
          .catch(function (err) {
            console.warn('[ticker] Erro ao carregar planilha:', err);
            var track = document.getElementById('tickerTrack');
            track.style.animation = 'none';
            track.innerHTML = '<span class="ticker-error">Não foi possível carregar os avisos. Verifique se o arquivo 03_news_painel_noticias.xlsx está na mesma pasta.</span>';
          });
      }

      loadNoticias();
      setInterval(loadNoticias, REFRESH_MS);
    })();
  </script>
